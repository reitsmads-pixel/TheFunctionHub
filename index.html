<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>The Function Hub SA — Find trusted event suppliers in South Africa</title>
    <meta
      name="description"
      content="Venues, caterers, decor, photographers, DJs and more. Browse verified South African function and event suppliers, compare them, and send an enquiry in minutes."
    />
    <meta name="theme-color" content="#1b1035" />
    <link rel="canonical" href="https://www.thefunctionhubsa.co.za/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Function Hub SA" />
    <meta property="og:title" content="The Function Hub SA — Find trusted event suppliers" />
    <meta
      property="og:description"
      content="South Africa's directory of venues, caterers, decor, photographers and DJs. Compare suppliers and enquire for free."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify only detects forms in the deployed HTML, never in React output.
      This hidden copy registers the "contact" form; the visible React form on
      /contact posts to it.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
