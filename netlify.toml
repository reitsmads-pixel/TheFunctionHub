[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every unmatched path is served by index.html so React Router
# can handle deep links like /vendor/some-slug on a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Legacy WordPress paths -> new structure. Keeps existing Google results alive.
[[redirects]]
  from = "/Thefunctionhubsa/*"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
